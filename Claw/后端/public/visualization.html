<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵山胜境 - 数据可视化大屏</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Microsoft YaHei', sans-serif; 
      background: linear-gradient(135deg, #0c1445 0%, #1a1f3a 50%, #0d1835 100%); 
      color: #fff; 
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header { 
      padding: 20px 40px; 
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(0, 210, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { 
      font-size: 28px; 
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .time { 
      font-size: 14px; 
      color: #8892b0; 
      font-family: monospace;
    }
    .container { 
      padding: 20px; 
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      height: calc(100vh - 80px);
    }
    .card { 
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(0, 210, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    .card::before { 
      content: ''; 
      position: absolute; 
      top: 0; 
      left: 0; 
      right: 0; 
      height: 3px; 
      background: linear-gradient(90deg, #00d2ff, transparent); 
    }
    .card-title { 
      font-size: 14px; 
      color: #8892b0; 
      margin-bottom: 15px; 
      display: flex; 
      align-items: center; 
      gap: 8px;
    }
    .card-title::before { 
      content: ''; 
      width: 4px; 
      height: 14px; 
      background: #00d2ff; 
      border-radius: 2px;
    }
    .stat-grid { 
      grid-column: span 12; 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 16px;
    }
    .stat-item { 
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .stat-item::after { 
      content: ''; 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      height: 2px; 
      background: linear-gradient(90deg, transparent, #00d2ff, transparent); 
      opacity: 0.5;
    }
    .stat-value { 
      font-size: 36px; 
      font-weight: bold; 
      background: linear-gradient(180deg, #fff, #8892b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
    }
    .stat-label { 
      font-size: 14px; 
      color: #8892b0; 
    }
    .stat-change { 
      font-size: 12px; 
      margin-top: 8px; 
      color: #00d2ff; 
    }
    .map-card { grid-column: span 5; }
    .left-panel { grid-column: span 3; }
    .right-panel { grid-column: span 4; }
    .bottom-left { grid-column: span 5; }
    .bottom-center { grid-column: span 4; }
    .bottom-right { grid-column: span 3; }
    .chart-container { 
      width: 100%; 
      height: calc(100% - 50px); 
    }
    .small-chart { 
      display: flex; 
      flex-direction: column; 
      height: calc(100% - 50px);
    }
    .pie-chart-container { 
      flex: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    .legend-list { 
      list-style: none; 
      padding: 0; 
      margin-top: 10px; 
    }
    .legend-item { 
      display: flex; 
      align-items: center; 
      padding: 5px 0; 
      font-size: 12px;
    }
    .legend-color { 
      width: 12px; 
      height: 12px; 
      border-radius: 2px; 
      margin-right: 8px; 
    }
    .legend-text { color: #8892b0; }
    .legend-value { margin-left: auto; color: #ccd6f6; font-weight: bold; }
    @media (max-width: 1200px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .map-card, .left-panel, .right-panel, .bottom-left, .bottom-center, .bottom-right { grid-column: span 12; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>灵山胜境智慧旅游大数据可视化平台</h1>
    <div class="time" id="currentTime">2024-01-01 00:00:00</div>
  </div>
  
  <div class="container">
    <div class="stat-grid">
      <div class="stat-item">
        <div class="stat-value" id="totalVisits">0</div>
        <div class="stat-label">总访问人次</div>
        <div class="stat-change">↑ 12.5% 较上周</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="avgDuration">0</div>
        <div class="stat-label">平均停留时长</div>
        <div class="stat-change">↑ 8.3% 较上周</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="avgConsumption">¥0</div>
        <div class="stat-label">人均消费</div>
        <div class="stat-change">↑ 15.2% 较上周</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="satisfaction">0%</div>
        <div class="stat-label">游客满意度</div>
        <div class="stat-change">↑ 2.1% 较上周</div>
      </div>
    </div>
    
    <div class="card map-card">
      <div class="card-title">游客来源地分布</div>
      <div class="chart-container" id="regionChart"></div>
    </div>
    
    <div class="card left-panel">
      <div class="card-title">景点热度排行</div>
      <div class="chart-container" id="rankingChart"></div>
    </div>
    
    <div class="card right-panel">
      <div class="card-title">游客年龄分布</div>
      <div class="small-chart">
        <div class="pie-chart-container">
          <div id="agePie" style="width: 100%; height: 200px;"></div>
        </div>
        <ul class="legend-list" id="ageLegend"></ul>
      </div>
    </div>
    
    <div class="card bottom-left">
      <div class="card-title">月度客流趋势</div>
      <div class="chart-container" id="monthlyChart"></div>
    </div>
    
    <div class="card bottom-center">
      <div class="card-title">消费结构分析</div>
      <div class="small-chart">
        <div class="pie-chart-container">
          <div id="consumptionPie" style="width: 100%; height: 200px;"></div>
        </div>
        <ul class="legend-list" id="consumptionLegend"></ul>
      </div>
    </div>
    
    <div class="card bottom-right">
      <div class="card-title">游客属性分析</div>
      <div class="small-chart">
        <div class="pie-chart-container">
          <div id="genderPie" style="width: 100%; height: 120px;"></div>
        </div>
        <ul class="legend-list" id="genderLegend"></ul>
        <div style="margin-top: 15px; height: 1px; background: rgba(0, 210, 255, 0.2);"></div>
        <div class="pie-chart-container" style="margin-top: 10px;">
          <div id="tourTypePie" style="width: 100%; height: 120px;"></div>
        </div>
        <ul class="legend-list" id="tourTypeLegend"></ul>
      </div>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('currentTime').textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateTime, 1000);
    updateTime();

    let regionChart, rankingChart, monthlyChart, agePie, consumptionPie, genderPie, tourTypePie;

    async function loadData() {
      try {
        const response = await fetch('/api/visualization/dashboard');
        const data = await response.json();
        renderDashboard(data);
      } catch (error) {
        console.error('加载数据失败:', error);
        renderDashboard(getMockData());
      }
    }

    function getMockData() {
      return {
        overview: { totalVisits: 4566, avgStayDuration: 3.8, avgConsumption: 680.96, satisfactionRate: 96.5 },
        spotRankings: [
          { name: '灵山大佛', count: 286 },
          { name: '禅意小镇·拈花湾', count: 255 },
          { name: '灵山胜境', count: 236 },
          { name: '灵山梵宫', count: 200 },
          { name: '九龙灌浴', count: 180 },
          { name: '五印坛城', count: 150 },
          { name: '祥符禅寺', count: 120 }
        ],
        consumptionStructure: [
          { name: '餐饮', value: 199.26 },
          { name: '购物', value: 206.53 },
          { name: '交通', value: 121.44 },
          { name: '娱乐', value: 93.58 }
        ],
        monthlyVisits: { months: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'], data: [228, 182, 365, 456, 547, 593, 684, 639, 456, 365, 228, 273] },
        ageDistribution: [
          { name: '18岁以下', value: 547 },
          { name: '18-25岁', value: 1278 },
          { name: '26-35岁', value: 1598 },
          { name: '36-45岁', value: 821 },
          { name: '46-55岁', value: 228 },
          { name: '55岁以上', value: 91 }
        ],
        genderDistribution: [{ name: '男性', value: 2191 }, { name: '女性', value: 2374 }],
        tourTypeDistribution: [
          { name: '家庭游', value: 1598 },
          { name: '情侣游', value: 1278 },
          { name: '朋友游', value: 1004 },
          { name: '独自游', value: 456 },
          { name: '团队游', value: 228 }
        ]
      };
    }

    function renderDashboard(data) {
      updateStats(data.overview);
      renderRegionChart(data);
      renderRankingChart(data.spotRankings);
      renderMonthlyChart(data.monthlyVisits);
      renderPieChart('agePie', data.ageDistribution, ['#00d2ff', '#3a7bd5', '#8b5cf6', '#f59e0b', '#ef4444', '#10b981'], 'ageLegend');
      renderPieChart('consumptionPie', data.consumptionStructure, ['#00d2ff', '#3a7bd5', '#8b5cf6', '#f59e0b'], 'consumptionLegend');
      renderPieChart('genderPie', data.genderDistribution, ['#00d2ff', '#f472b6'], 'genderLegend');
      renderPieChart('tourTypePie', data.tourTypeDistribution, ['#00d2ff', '#3a7bd5', '#8b5cf6', '#f59e0b', '#ef4444'], 'tourTypeLegend');
    }

    function updateStats(overview) {
      animateValue('totalVisits', 0, overview.totalVisits, 2000);
      document.getElementById('avgDuration').textContent = overview.avgStayDuration + '小时';
      document.getElementById('avgConsumption').textContent = '¥' + overview.avgConsumption.toFixed(2);
      document.getElementById('satisfaction').textContent = overview.satisfactionRate + '%';
    }

    function animateValue(id, start, end, duration) {
      const obj = document.getElementById(id);
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.textContent = Math.floor(progress * (end - start) + start).toLocaleString();
        if (progress < 1) window.requestAnimationFrame(step);
      };
      window.requestAnimationFrame(step);
    }

    function renderRegionChart(data) {
      if (!regionChart) regionChart = echarts.init(document.getElementById('regionChart'));
      
      const regionData = [
        { name: '江苏', value: 3200 },
        { name: '上海', value: 2800 },
        { name: '浙江', value: 2500 },
        { name: '安徽', value: 1800 },
        { name: '山东', value: 1500 },
        { name: '北京', value: 1200 },
        { name: '广东', value: 1000 },
        { name: '湖北', value: 800 },
        { name: '四川', value: 600 },
        { name: '湖南', value: 500 },
        { name: '福建', value: 450 },
        { name: '其他', value: 1500 }
      ];

      const option = {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          backgroundColor: 'rgba(15, 23, 42, 0.9)',
          borderColor: 'rgba(0, 210, 255, 0.3)',
          textStyle: { color: '#fff' },
          formatter: (params) => `${params[0].name}<br/>游客数量: ${params[0].value.toLocaleString()}人`
        },
        grid: { left: '3%', right: '4%', bottom: '3%', top: '3%', containLabel: true },
        xAxis: {
          type: 'category',
          data: regionData.map(item => item.name),
          axisLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.3)' } },
          axisLabel: { color: '#8892b0', fontSize: 11, rotate: 30 },
          splitLine: { show: false }
        },
        yAxis: {
          type: 'value',
          axisLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.3)' } },
          axisLabel: { color: '#8892b0' },
          splitLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.1)' } }
        },
        series: [{
          name: '游客数量',
          type: 'bar',
          data: regionData.map(item => item.value),
          barWidth: '55%',
          itemStyle: {
            borderRadius: [4, 4, 0, 0],
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: '#00d2ff' },
              { offset: 1, color: '#3a7bd5' }
            ])
          },
          emphasis: {
            itemStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: '#3a7bd5' },
                { offset: 1, color: '#00d2ff' }
              ])
            }
          },
          label: { show: true, position: 'top', color: '#00d2ff', fontSize: 11, formatter: '{c}' }
        }]
      };
      regionChart.setOption(option);
    }

    function renderRankingChart(data) {
      if (!rankingChart) rankingChart = echarts.init(document.getElementById('rankingChart'));
      
      const sortedData = [...data].sort((a, b) => a.count - b.count);
      const names = sortedData.map(item => item.name);
      const counts = sortedData.map(item => item.count);

      const option = {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          backgroundColor: 'rgba(15, 23, 42, 0.9)',
          borderColor: 'rgba(0, 210, 255, 0.3)',
          textStyle: { color: '#fff' }
        },
        grid: { left: '3%', right: '4%', bottom: '3%', top: '3%', containLabel: true },
        xAxis: {
          type: 'value',
          axisLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.3)' } },
          axisLabel: { color: '#8892b0' },
          splitLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.1)' } }
        },
        yAxis: {
          type: 'category',
          data: names,
          axisLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.3)' } },
          axisLabel: { color: '#ccd6f6', fontSize: 12 }
        },
        series: [{
          name: '访问量',
          type: 'bar',
          data: counts,
          barWidth: '50%',
          itemStyle: {
            borderRadius: [0, 4, 4, 0],
            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
              { offset: 0, color: '#00d2ff' },
              { offset: 1, color: '#3a7bd5' }
            ])
          },
          emphasis: {
            itemStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                { offset: 0, color: '#3a7bd5' },
                { offset: 1, color: '#00d2ff' }
              ])
            }
          },
          label: { show: true, position: 'right', color: '#00d2ff', formatter: '{c}' }
        }]
      };
      rankingChart.setOption(option);
    }

    function renderMonthlyChart(data) {
      if (!monthlyChart) monthlyChart = echarts.init(document.getElementById('monthlyChart'));

      const option = {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(15, 23, 42, 0.9)',
          borderColor: 'rgba(0, 210, 255, 0.3)',
          textStyle: { color: '#fff' }
        },
        grid: { left: '3%', right: '4%', bottom: '3%', top: '3%', containLabel: true },
        xAxis: {
          type: 'category',
          boundaryGap: false,
          data: data.months,
          axisLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.3)' } },
          axisLabel: { color: '#8892b0', fontSize: 11 }
        },
        yAxis: {
          type: 'value',
          axisLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.3)' } },
          axisLabel: { color: '#8892b0' },
          splitLine: { lineStyle: { color: 'rgba(0, 210, 255, 0.1)' } }
        },
        series: [{
          name: '客流量',
          type: 'line',
          smooth: true,
          data: data.data,
          lineStyle: { color: '#00d2ff', width: 3 },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(0, 210, 255, 0.4)' },
              { offset: 1, color: 'rgba(0, 210, 255, 0.05)' }
            ])
          },
          itemStyle: { color: '#00d2ff' },
          symbol: 'circle',
          symbolSize: 6
        }]
      };
      monthlyChart.setOption(option);
    }

    function renderPieChart(containerId, data, colors, legendId) {
      const chart = echarts.init(document.getElementById(containerId));
      
      const option = {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'item',
          backgroundColor: 'rgba(15, 23, 42, 0.9)',
          borderColor: 'rgba(0, 210, 255, 0.3)',
          textStyle: { color: '#fff' },
          formatter: (params) => {
            const total = data.reduce((sum, item) => sum + item.value, 0);
            const percent = ((params.value / total) * 100).toFixed(1);
            return `${params.name}<br/>数量: ${params.value}人<br/>占比: ${percent}%`;
          }
        },
        series: [{
          type: 'pie',
          radius: ['45%', '70%'],
          center: ['50%', '50%'],
          avoidLabelOverlap: false,
          itemStyle: { borderRadius: 6, borderColor: 'rgba(15, 23, 42, 0.8)', borderWidth: 2 },
          label: { show: false },
          emphasis: { label: { show: true, color: '#fff', fontSize: 12, fontWeight: 'bold' } },
          labelLine: { show: false },
          data: data.map((item, index) => ({
            ...item,
            itemStyle: { color: colors[index % colors.length] }
          }))
        }]
      };

      chart.setOption(option);

      const legend = document.getElementById(legendId);
      const total = data.reduce((sum, item) => sum + item.value, 0);
      legend.innerHTML = data.map((item, index) => {
        const percent = ((item.value / total) * 100).toFixed(1);
        return `
          <li class="legend-item">
            <span class="legend-color" style="background: ${colors[index % colors.length]}"></span>
            <span class="legend-text">${item.name}</span>
            <span class="legend-value">${item.value} (${percent}%)</span>
          </li>
        `;
      }).join('');
    }

    window.addEventListener('resize', () => {
      regionChart && regionChart.resize();
      rankingChart && rankingChart.resize();
      monthlyChart && monthlyChart.resize();
      agePie && agePie.resize();
      consumptionPie && consumptionPie.resize();
      genderPie && genderPie.resize();
      tourTypePie && tourTypePie.resize();
    });

    loadData();
  </script>
</body>
</html>
